[workspace]
members = ["programs/*"]
# MSRV-aware resolution: keeps the program's dependency graph buildable by the
# Solana platform-tools rustc even though the host toolchain is newer.
resolver = "3"

[workspace.package]
edition = "2021"
rust-version = "1.89"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
