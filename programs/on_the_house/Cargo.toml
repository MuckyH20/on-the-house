[package]
name = "on_the_house"
version = "0.1.0"
description = "On the House: event-contingent shop promos with non-transferable refund claims, hedged on prediction markets"
license = "MIT"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "on_the_house"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.2", features = ["init-if-needed"] }
anchor-spl = "1.2.2"

[dev-dependencies]
# Same LiteSVM line as Anchor 1.2.2's `anchor init` template.
litesvm = "0.15.0"
solana-message = "4"
solana-transaction = "4"
solana-signer = "3"
solana-keypair = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
